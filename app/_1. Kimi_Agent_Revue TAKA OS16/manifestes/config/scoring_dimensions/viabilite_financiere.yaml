dimension_id: "viabilite_financiere"
name: "Viabilite Financiere"
version: 1
input_schema:
  - ao.estimated_amount
  - ao.cautionnement
  - ao.cautionnement_percent
  - ao.payment_terms_days
  - enterprise.ca
  - enterprise.tresorerie
  - enterprise.ratio_endettement
  - enterprise.capital_social
  - enterprise.avg_project_size
rules:
  - condition: "ao.estimated_amount > enterprise.ca * 0.5"
    action: "score = 10"
    score_value: 10.0
    strict: false
    explanation_template: "AO represente plus de 50% du CA — risque financier majeur (score bas)"

  - condition: "enterprise.tresorerie < ao.cautionnement"
    action: "score = 5"
    score_value: 5.0
    strict: false
    explanation_template: "Tresorerie insuffisante pour couvrir le cautionnement — risque tres eleve"

  - condition: "ao.cautionnement_percent > 0.05"
    action: "score -= 25"
    score_value: 25.0
    strict: false
    explanation_template: "Cautionnement superieur a 5% du montant estime — penalite (-25)"

  - condition: "enterprise.ratio_endettement > 0.50"
    action: "score -= 20"
    score_value: 20.0
    strict: false
    explanation_template: "Ratio d'endettement > 50% — fragilite financiere (-20)"

  - condition: "ao.estimated_amount <= enterprise.avg_project_size * 1.2"
    action: "score += 25"
    score_value: 25.0
    strict: false
    explanation_template: "AO dans la fourchette habituelle des projets (+25)"

  - condition: "ao.payment_terms_days > 60"
    action: "score -= 15"
    score_value: 15.0
    strict: false
    explanation_template: "Delai de paiement > 60 jours — impact tresorerie negatif (-15)"

  - condition: "enterprise.capital_social < ao.estimated_amount * 0.10"
    action: "score -= 20"
    score_value: 20.0
    strict: false
    explanation_template: "Capital social < 10% du montant de l'AO — capacite financiere insuffisante (-20)"

default_score: 50.0
default_weight: 0.25
