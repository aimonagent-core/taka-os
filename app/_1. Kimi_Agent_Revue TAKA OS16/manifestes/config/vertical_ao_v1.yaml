# ============================================================================
# TAKA OS - Vertical Appels d'Offres v1.0.0
# Manifeste declaratif complet des agents, capabilities, triggers et permissions
# Format: TAKA Swarm Manifest v1.0
# License: MIT
# ============================================================================

vertical_id: taka-ao-v1
name: "Vertical Appels d'Offres TAKA OS"
version: "1.0.0"
description: "Detection, qualification, redaction et depot automatise d'appels d'offres publics"
author: "TAKA OS Core Team"
date: "2025-01-15"

# ---------------------------------------------------------------------------
# REFERENCES ARCHITECTURE
# ---------------------------------------------------------------------------
# Kernel:       TAKA OS Kernel v1.0+ (EventBus asyncio -> NATS)
# Registry:     Swarm Registry v0.5+
# Memory:       Memory Mesh 3 zones v1.1+
# LLM:          Mistral AI (Mistral Large 2)
# Vision:       TAKA Vision v1.2+ (Holo-1 / Ui-TARS)
# Vault:        TAKA Vault v0.8+ (secrets & credentials)
# Database:     PostgreSQL 16+ avec pgvector
# ---------------------------------------------------------------------------

# ============================================================================
# AGENTS
# ============================================================================
agents:

  # ---------------------------------------------------------------------------
  # AGENT: VEILLEUR
  # ---------------------------------------------------------------------------
  - agent_id: veilleur
    name: "Agent Veilleur"
    version: "1.0"
    description: "Surveille les portails AO (BOAMP, TED, e-marchespublics, places de marche) et detecte les nouveaux appels d'offres"
    status: stable
    dependencies: []

    capabilities:
      - name: detect_ao
        version: "1.0"
        description: "Detecter un nouvel AO sur un portail public"
        input_schema:
          type: object
          properties:
            portal:
              type: string
              enum: [BOAMP, TED, E_MP, ATTRACTIVITE, MARCHESPUBLICS]
              description: "Portail source de l'appel d'offres"
            keywords:
              type: array
              items: { type: string }
              description: "Mots-cles de recherche"
            cpv_codes:
              type: array
              items:
                type: string
                pattern: '^\d{8}$'
              description: "Codes CPV europeens (8 chiffres)"
            min_amount:
              type: number
              minimum: 0
              description: "Montant minimum estime (EUR)"
            max_amount:
              type: number
              minimum: 0
              description: "Montant maximum estime (EUR)"
            regions:
              type: array
              items: { type: string }
              description: "Regions cibles (codes INSEE ou noms)"
            date_from:
              type: string
              format: date-time
              description: "Date de publication minimale"
            date_to:
              type: string
              format: date-time
              description: "Date de publication maximale"
          required: [portal]
        output_schema:
          type: object
          properties:
            ao_id:
              type: string
              description: "Identifiant unique de l'AO"
            title:
              type: string
              description: "Intitule de l'AO"
            description:
              type: string
              description: "Description synthetique"
            cpv_code:
              type: string
              pattern: '^\d{8}$'
            estimated_amount:
              type: number
              minimum: 0
            deadline:
              type: string
              format: date-time
              description: "Date limite de depot"
            publication_date:
              type: string
              format: date-time
            buyer_name:
              type: string
              description: "Nom de l'acheteur public"
            buyer_siret:
              type: string
              description: "SIRET de l'acheteur public"
            portal_url:
              type: string
              format: uri
            dce_url:
              type: string
              format: uri
              description: "Lien vers le DCE complet"
            confidence_score:
              type: number
              minimum: 0
              maximum: 1
              description: "Score de confiance de la detection (0-1)"
            raw_metadata:
              type: object
              description: "Metadonnees brutes du portail"
          required: [ao_id, title, deadline, confidence_score, cpv_code]

      - name: parse_pdf
        version: "1.0"
        description: "Extraire le texte, tableaux et metadonnees d'un DCE PDF"
        input_schema:
          type: object
          properties:
            file_path:
              type: string
              description: "Chemin vers le fichier local"
            file_type:
              type: string
              enum: [pdf, docx, zip, odt, rtf]
              default: pdf
            extraction_level:
              type: string
              enum: [text, tables, ocr, full]
              default: full
              description: "Niveau d'extraction du document"
            language:
              type: string
              enum: [fr, en, de, es, it]
              default: fr
          required: [file_path]
        output_schema:
          type: object
          properties:
            raw_text:
              type: string
              description: "Texte brut extrait"
            tables:
              type: array
              description: "Tableaux extraits avec structure"
              items:
                type: object
                properties:
                  headers: { type: array, items: { type: string } }
                  rows: { type: array, items: { type: array } }
                  page: { type: integer }
            metadata:
              type: object
              properties:
                author: { type: string }
                creation_date: { type: string }
                page_count: { type: integer }
                file_size: { type: integer }
                title: { type: string }
            sections_detected:
              type: array
              items: { type: string }
              description: "Sections identifiees (ex: Cahier des Charges, Reglement)"
            pages:
              type: integer
              description: "Nombre de pages"
            word_count:
              type: integer
            ocr_used:
              type: boolean
              description: "L'OCR a-t-il ete utilise"
          required: [raw_text, metadata, pages]

      - name: classify_cpv
        version: "1.0"
        description: "Classifier un AO selon le vocabulaire CPV et le mapping secteur"
        input_schema:
          type: object
          properties:
            ao_text:
              type: string
            cpv_hint:
              type: string
          required: [ao_text]
        output_schema:
          type: object
          properties:
            cpv_primary:
              type: string
              pattern: '^\d{8}$'
            cpv_secondary:
              type: array
              items: { type: string }
            sector:
              type: string
              enum: [IT_SERVICES, CONSTRUCTION, CONSULTING, FOURNITURES, SERVICES, TRAVAUX, AUTRE]
            subsector:
              type: string
            confidence:
              type: number
              minimum: 0
              maximum: 1
          required: [cpv_primary, sector, confidence]

    triggers:
      - type: cron
        value: "0 6,12,18 * * *"
        description: "Polling portails a 6h, 12h, 18h (UTC+1)"
        timezone: "Europe/Paris"
        enabled: true
      - type: event
        value: "user.request_veille"
        description: "Declenchement manuel par l'utilisateur"
        priority: high
      - type: event
        value: "webhook.new_ao"
        description: "Notification push d'un portail (futur)"
        priority: high
      - type: event
        value: "veille.retry"
        description: "Retry apres echec"
        priority: normal

    permissions:
      memory: [read.public, write.private]
      bus: [publish, subscribe]
      external_apis:
        - BOAMP_API
        - TED_API
        - E_MP_SCRAPER
        - ATTRACTIVITE_API
        - MARCHESPUBLICS_API
        - CHIFT_API

    lifecycle:
      max_execution_time: 300
      retry_policy:
        max_retries: 3
        backoff: exponential
        initial_delay: 10
        max_delay: 120
      timeout_action: "publish_event:veille.timeout"
      failure_action: "publish_event:veille.failed"
      success_action: "publish_event:veille.completed"

    config:
      portals:
        BOAMP:
          enabled: true
          url: "https://www.boamp.fr/api/v2"
          rate_limit: "1req/2s"
          timeout: 30
          auth_type: none
        TED:
          enabled: true
          url: "https://ted.europa.eu/api/v2"
          rate_limit: "1req/5s"
          timeout: 45
          auth_type: api_key
        E_MP:
          enabled: true
          url: "https://www.e-marchespublics.com"
          rate_limit: "1req/10s"
          timeout: 60
          auth_type: basic
        ATTRACTIVITE:
          enabled: false
          url: "https://www.marches-publics.gouv.fr"
          rate_limit: "1req/5s"
          timeout: 30
        MARCHESPUBLICS:
          enabled: false
          url: "https://www.marchespublics.com"
          rate_limit: "1req/10s"
          timeout: 30
      filters:
        min_confidence: 0.7
        exclude_keywords:
          - "fourniture"
          - "cession"
          - "location"
          - "bail"
          - "cession de droit"
        min_amount_eur: 5000
        max_results_per_run: 100
      parsing:
        ocr_enabled: true
        ocr_language: "fra"
        extract_tables: true
        extract_images_metadata: true

  # ---------------------------------------------------------------------------
  # AGENT: SCORER
  # ---------------------------------------------------------------------------
  - agent_id: scorer
    name: "Agent Scorer"
    version: "1.0"
    description: "Evalue la compatibilite entre un AO detecte et le profil de l'entreprise"
    status: stable
    dependencies:
      - agent_id: veilleur
        min_version: "1.0"

    capabilities:
      - name: evaluate_opportunity
        version: "1.0"
        description: "Calculer un score multi-criteres pour un AO donne"
        input_schema:
          type: object
          properties:
            ao_id:
              type: string
            company_profile_id:
              type: string
              description: "Reference du profil entreprise"
            scoring_profile:
              type: string
              enum: [prudent, opportuniste, specialise]
              default: prudent
            override_weights:
              type: object
              description: "Surcharge temporaire des poids"
          required: [ao_id, company_profile_id]
        output_schema:
          type: object
          properties:
            ao_id: { type: string }
            company_profile_id: { type: string }
            global_score:
              type: number
              minimum: 0
              maximum: 1
              description: "Score global (0-1)"
            decision:
              type: string
              enum: [GO, NO_GO, MAYBE]
            dimensions:
              type: object
              properties:
                coherence_metier:
                  type: object
                  properties:
                    score: { type: number }
                    weight: { type: number }
                    justification: { type: string }
                viabilite_financiere:
                  type: object
                  properties:
                    score: { type: number }
                    weight: { type: number }
                    justification: { type: string }
                accessibilite_geographique:
                  type: object
                  properties:
                    score: { type: number }
                    weight: { type: number }
                    justification: { type: string }
                faisabilite_temporelle:
                  type: object
                  properties:
                    score: { type: number }
                    weight: { type: number }
                    justification: { type: string }
                intelligence_concurrentielle:
                  type: object
                  properties:
                    score: { type: number }
                    weight: { type: number }
                    justification: { type: string }
            risk_flags:
              type: array
              items: { type: string }
              description: "Alertes de risque identifiees"
            recommended_actions:
              type: array
              items: { type: string }
              description: "Actions recommandees"
          required: [ao_id, global_score, decision, dimensions]

      - name: explain_score
        version: "1.0"
        description: "Generer une explication humaine du score et de la decision"
        input_schema:
          type: object
          properties:
            scoring_result:
              type: object
              description: "Resultat de evaluate_opportunity"
            language:
              type: string
              enum: [fr, en]
              default: fr
            detail_level:
              type: string
              enum: [summary, detailed, executive]
              default: detailed
          required: [scoring_result]
        output_schema:
          type: object
          properties:
            summary: { type: string }
            detailed_explanation: { type: string }
            key_factors:
              type: array
              items: { type: string }
            comparable_aos:
              type: array
              items:
                type: object
                properties:
                  ao_id: { type: string }
                  title: { type: string }
                  final_score: { type: number }
            confidence: { type: number }
          required: [summary, detailed_explanation, key_factors]

      - name: compare_opportunities
        version: "1.0"
        description: "Comparer plusieurs AO entre eux selon le profil entreprise"
        input_schema:
          type: object
          properties:
            ao_ids:
              type: array
              items: { type: string }
            company_profile_id: { type: string }
            scoring_profile:
              type: string
              enum: [prudent, opportuniste, specialise]
              default: prudent
          required: [ao_ids, company_profile_id]
        output_schema:
          type: object
          properties:
            comparisons:
              type: array
              items:
                type: object
                properties:
                  ao_id: { type: string }
                  global_score: { type: number }
                  decision: { type: string }
                  ranking: { type: integer }
            best_choice:
              type: string
              description: "ao_id recommande"
            trade_off_analysis: { type: string }

    triggers:
      - type: event
        value: "ao.new_detected"
        description: "Nouvel AO detecte par le Veilleur"
        priority: high
        condition: "confidence_score >= 0.7"
      - type: event
        value: "user.request_score"
        description: "Demande manuelle de scoring"
        priority: high
      - type: event
        value: "company.profile_updated"
        description: "Re-scoring apres mise a jour du profil entreprise"
        priority: normal

    permissions:
      memory: [read.public, read.private, write.private]
      bus: [publish, subscribe]
      llm_api: [mistral.large, mistral.medium]
      scoring_engine: [execute]
      external_apis:
        - CHIFT_API
        - MISTRAL_API

    lifecycle:
      max_execution_time: 120
      retry_policy:
        max_retries: 2
        backoff: linear
        initial_delay: 5
        max_delay: 30
      timeout_action: "publish_event:scorer.timeout"
      failure_action: "publish_event:scorer.failed"

    config:
      scoring_engine:
        model: "mistral-large-latest"
        temperature: 0.2
        max_tokens: 4096
        batch_size: 5
      dimensions:
        coherence_metier:
          enabled: true
          llm_analysis: true
          keywords_matching: true
        viabilite_financiere:
          enabled: true
          source: "chift_financial_data"
          min_ca_ratio: 0.1
        accessibilite_geographique:
          enabled: true
          max_distance_km: 300
          penalite_distance: true
        faisabilite_temporelle:
          enabled: true
          min_preparation_days: 7
          penalite_deadline_serre: true
        intelligence_concurrentielle:
          enabled: true
          source: "historical_data"
          min_historical_wins: 2
      caching:
        ttl_seconds: 3600
        key_pattern: "score:{ao_id}:{profile_id}"

  # ---------------------------------------------------------------------------
  # AGENT: REDACTEUR
  # ---------------------------------------------------------------------------
  - agent_id: redacteur
    name: "Agent Redacteur"
    version: "1.0"
    description: "Genere les documents de candidature (memoire technique, DCE, attestations)"
    status: stable
    dependencies:
      - agent_id: scorer
        min_version: "1.0"

    capabilities:
      - name: generate_memoire
        version: "1.0"
        description: "Generer un memoire technique adapte au cahier des charges"
        input_schema:
          type: object
          properties:
            ao_id:
              type: string
            company_profile_id:
              type: string
            dce_text:
              type: string
              description: "Contenu du DCE parse"
            sections_to_generate:
              type: array
              items: { type: string }
              description: "Sections specifiques a generer (optionnel)"
            tone:
              type: string
              enum: [formal, persuasive, technical, hybrid]
              default: hybrid
            max_pages:
              type: integer
              default: 50
            references_projets:
              type: array
              items: { type: string }
              description: "IDs de projets references dans le CRM"
          required: [ao_id, company_profile_id, dce_text]
        output_schema:
          type: object
          properties:
            memoire_id:
              type: string
            ao_id: { type: string }
            sections:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  content: { type: string }
                  page_estimate: { type: integer }
            full_text: { type: string }
            word_count: { type: integer }
            page_estimate: { type: integer }
            quality_score:
              type: number
              minimum: 0
              maximum: 1
            compliance_check:
              type: object
              properties:
                cahier_des_charges_coverage: { type: number }
                required_sections_present: { type: array, items: { type: string } }
                missing_sections: { type: array, items: { type: string } }
            generation_metadata:
              type: object
              properties:
                model: { type: string }
                tokens_used: { type: integer }
                generation_time_ms: { type: integer }
          required: [memoire_id, ao_id, sections, quality_score]

      - name: generate_dce
        version: "1.0"
        description: "Generer le dossier de candidature externe (offre financiere, DC1, DC2)"
        input_schema:
          type: object
          properties:
            ao_id: { type: string }
            company_profile_id: { type: string }
            pricing_strategy:
              type: string
              enum: [competitive, value_based, cost_plus, aggressive]
              default: value_based
            discount_percent:
              type: number
              minimum: 0
              maximum: 30
            documents_required:
              type: array
              items:
                type: string
                enum: [DC1, DC2, DC3, DC4, OFFRE_FINANCIERE, ENGAGEMENT_CPAG, MANDAT_BANCAIRE]
              default: [DC1, DC2, OFFRE_FINANCIERE]
          required: [ao_id, company_profile_id]
        output_schema:
          type: object
          properties:
            dce_id: { type: string }
            documents:
              type: array
              items:
                type: object
                properties:
                  doc_type: { type: string }
                  content: { type: string }
                  file_path: { type: string }
                  status:
                    type: string
                    enum: [generated, needs_signature, ready]
            financial_offer:
              type: object
              properties:
                ht_amount: { type: number }
                ttc_amount: { type: number }
                tva_rate: { type: number }
                detail:
                  type: array
                  items:
                    type: object
                    properties:
                      line_item: { type: string }
                      quantity: { type: number }
                      unit_price: { type: number }
                      total: { type: number }
            ready_for_signature: { type: boolean }
          required: [dce_id, documents, financial_offer]

      - name: generate_attestation
        version: "1.0"
        description: "Generer les attestations requises (fiscale, sociale, assurance)"
        input_schema:
          type: object
          properties:
            attestation_type:
              type: string
              enum: [FISCALE, SOCIALE, ASSURANCE, ENVIRONNEMENTALE, ETHIQUE, QUALITE]
            company_profile_id: { type: string }
            ao_id: { type: string }
            custom_fields:
              type: object
              description: "Champs specifiques a l'attestation"
          required: [attestation_type, company_profile_id]
        output_schema:
          type: object
          properties:
            attestation_id: { type: string }
            doc_type: { type: string }
            content: { type: string }
            file_path: { type: string }
            valid_until:
              type: string
              format: date-time
            status:
              type: string
              enum: [generated, needs_validation, validated]
          required: [attestation_id, doc_type, content, status]

    triggers:
      - type: event
        value: "ao.decision:deposer"
        description: "Decision GO de deposer emise par le Scorer"
        priority: high
      - type: event
        value: "user.request_redaction"
        description: "Demande manuelle de redaction"
        priority: high
      - type: event
        value: "redaction.retry"
        description: "Retry apres echec ou amelioration demandee"
        priority: normal

    permissions:
      memory: [read.public, read.private, write.private]
      bus: [publish, subscribe]
      llm_api: [mistral.large, mistral.medium]
      vault: [read]
      external_apis:
        - MISTRAL_API
        - CHIFT_API
        - YOUSIGN_API
        - DOUGS_API

    lifecycle:
      max_execution_time: 600
      retry_policy:
        max_retries: 2
        backoff: exponential
        initial_delay: 15
        max_delay: 180
      timeout_action: "publish_event:redacteur.timeout"
      failure_action: "publish_event:redacteur.failed"
      success_action: "publish_event:redacteur.completed"

    config:
      generation:
        model: "mistral-large-latest"
        temperature: 0.3
        max_tokens: 8192
        streaming: true
        chunks_overlap: 200
      quality:
        min_quality_score: 0.75
        auto_retry_below_threshold: true
        max_auto_retries: 2
      templates:
        memoire_base_template: "templates/memoire_technique_base.md"
        dce_template: "templates/dce_standard.md"
        attestation_template_dir: "templates/attestations/"
      output:
        format: [docx, pdf, odt]
        default_format: docx
        include_page_numbers: true
        include_header_footer: true
      compliance:
        required_sections:
          - "Presentation de l'entreprise"
          - "Methodologie"
          - "Moyens mobilises"
          - "References"
          - "Planning d'execution"
          - "Garanties et assurance"

  # ---------------------------------------------------------------------------
  # AGENT: DEPOSANT
  # ---------------------------------------------------------------------------
  - agent_id: deposant
    name: "Agent Deposant"
    version: "1.0"
    description: "Depose la candidature sur le portail de l'acheteur public"
    status: beta
    dependencies:
      - agent_id: redacteur
        min_version: "1.0"
      - agent_id: taka_vision
        min_version: "1.2"
        description: "TAKA Vision Holo-1 / Ui-TARS pour navigation visuelle"

    capabilities:
      - name: submit_portal
        version: "1.0"
        description: "Deposer une candidature sur un portail acheteur"
        input_schema:
          type: object
          properties:
            ao_id: { type: string }
            portal_type:
              type: string
              enum: [BOAMP, E_MP, ATTRACTIVITE, MARCHESPUBLICS, CUSTOM_FORM]
            credentials_key:
              type: string
              description: "Cle Vault pour les credentials du portail"
            documents:
              type: array
              items:
                type: object
                properties:
                  doc_id: { type: string }
                  file_path: { type: string }
                  doc_type: { type: string }
            confirm_before_submit:
              type: boolean
              default: true
          required: [ao_id, portal_type, credentials_key, documents]
        output_schema:
          type: object
          properties:
            submission_id: { type: string }
            ao_id: { type: string }
            status:
              type: string
              enum: [submitted, pending_confirmation, failed, partially_submitted]
            portal_reference:
              type: string
              description: "Numero de reference du depot sur le portail"
            submitted_at:
              type: string
              format: date-time
            screenshot_proof:
              type: string
              description: "Chemin vers la capture d'ecran de confirmation"
            errors:
              type: array
              items: { type: string }
          required: [submission_id, ao_id, status]

      - name: upload_file
        version: "1.0"
        description: "Uploader un fichier sur le portail de l'acheteur"
        input_schema:
          type: object
          properties:
            portal_type: { type: string }
            credentials_key: { type: string }
            file_path: { type: string }
            target_field:
              type: string
              description: "Nom du champ de formulaire cible"
          required: [portal_type, credentials_key, file_path]
        output_schema:
          type: object
          properties:
            upload_id: { type: string }
            status: { type: string, enum: [uploaded, failed, timeout] }
            file_size: { type: integer }
            portal_file_id:
              type: string
              description: "ID du fichier cote portail"
          required: [upload_id, status]

      - name: capture_proof
        version: "1.0"
        description: "Capturer une preuve visuelle du depot (screenshot, reference)"
        input_schema:
          type: object
          properties:
            ao_id: { type: string }
            submission_id: { type: string }
            proof_type:
              type: string
              enum: [screenshot, pdf_export, reference_number, video]
              default: screenshot
          required: [ao_id, submission_id]
        output_schema:
          type: object
          properties:
            proof_id: { type: string }
            proof_type: { type: string }
            file_path: { type: string }
            captured_at:
              type: string
              format: date-time
            integrity_hash:
              type: string
              description: "Hash SHA-256 pour verification d'integrite"
          required: [proof_id, proof_type, file_path]

    triggers:
      - type: event
        value: "memoire.ready"
        description: "Memoire technique genere et pret"
        priority: high
      - type: event
        value: "dce.ready"
        description: "DCE genere et pret"
        priority: high
      - type: event
        value: "user.request_depo"
        description: "Demande manuelle de depot"
        priority: high
      - type: event
        value: "deposant.retry"
        description: "Retry apres echec de depot"
        priority: high

    permissions:
      memory: [read.private, write.private]
      bus: [publish, subscribe]
      vault: [read]
      holo1: [execute]
      external_apis:
        - BOAMP_PORTAL
        - E_MP_PORTAL
        - YOUSIGN_API
        - DOCUSIGN_API

    lifecycle:
      max_execution_time: 300
      retry_policy:
        max_retries: 3
        backoff: exponential
        initial_delay: 20
        max_delay: 180
      timeout_action: "publish_event:deposant.timeout"
      failure_action: "publish_event:deposant.failed"
      success_action: "publish_event:deposant.completed"
      human_in_the_loop:
        enabled: true
        step: "confirm_before_submit"
        timeout_for_approval: 3600

    config:
      taka_vision:
        holo1:
          enabled: true
          model: "ui-tars-7b-dpo"
          vision_provider: "holo1"
          screenshot_quality: "high"
          action_delay_ms: 500
        browser:
          type: "chromium"
          headless: true
          viewport: { width: 1920, height: 1080 }
          user_agent: "TAKA-OS-Bot/1.0"
      portal_connectors:
        BOAMP:
          login_method: "manual_vault"
          upload_max_size_mb: 50
          supported_formats: [pdf, docx, zip]
        E_MP:
          login_method: "manual_vault"
          upload_max_size_mb: 100
          supported_formats: [pdf, docx, odt, zip]
      proof:
        capture_screenshot: true
        capture_pdf: true
        store_duration_days: 2555
        integrity_check: true
      safety:
        confirm_before_submit: true
        max_retry_per_portal: 3
        cooldown_between_attempts_seconds: 60

  # ---------------------------------------------------------------------------
  # AGENT: AUDITOR
  # ---------------------------------------------------------------------------
  - agent_id: auditor
    name: "Agent Auditor"
    version: "1.0"
    description: "Verifie la conformite reglementaire (AI Act, RGPD, marches publics)"
    status: stable
    dependencies: []

    capabilities:
      - name: check_compliance
        version: "1.0"
        description: "Verifier la conformite d'un processus ou document vs. referentiels"
        input_schema:
          type: object
          properties:
            target_type:
              type: string
              enum: [ao, memoire, dce, process, decision]
            target_id: { type: string }
            frameworks:
              type: array
              items:
                type: string
                enum: [AI_ACT, RGPD, MARCHES_PUBLICS, ISO27001, ISO9001]
              default: [AI_ACT, RGPD, MARCHES_PUBLICS]
            depth:
              type: string
              enum: [surface, standard, deep]
              default: standard
          required: [target_type, target_id]
        output_schema:
          type: object
          properties:
            audit_id: { type: string }
            target_type: { type: string }
            target_id: { type: string }
            overall_status:
              type: string
              enum: [compliant, non_compliant, partially_compliant, requires_review]
            frameworks:
              type: array
              items:
                type: object
                properties:
                  framework: { type: string }
                  status: { type: string }
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id: { type: string }
                        severity: { type: string, enum: [critical, high, medium, low, info] }
                        description: { type: string }
                        recommendation: { type: string }
            risk_score:
              type: number
              minimum: 0
              maximum: 1
            checked_at:
              type: string
              format: date-time
          required: [audit_id, overall_status, frameworks, risk_score]

      - name: generate_audit_report
        version: "1.0"
        description: "Generer un rapport d'audit complet et actionnable"
        input_schema:
          type: object
          properties:
            audit_id: { type: string }
            format:
              type: string
              enum: [json, markdown, pdf]
              default: markdown
            include_recommendations:
              type: boolean
              default: true
            include_timeline:
              type: boolean
              default: true
          required: [audit_id]
        output_schema:
          type: object
          properties:
            report_id: { type: string }
            audit_id: { type: string }
            content: { type: string }
            file_path: { type: string }
            format: { type: string }
            generated_at:
              type: string
              format: date-time
          required: [report_id, audit_id, content, format]

      - name: detect_risk
        version: "1.0"
        description: "Detecter les risques reglementaires dans un AO ou processus"
        input_schema:
          type: object
          properties:
            target_type:
              type: string
              enum: [ao, company_data, process, decision_chain]
            target_id: { type: string }
            risk_categories:
              type: array
              items:
                type: string
                enum: [legal, financial, reputational, operational, ethical]
              default: [legal, ethical, financial]
          required: [target_type, target_id]
        output_schema:
          type: object
          properties:
            risk_assessment_id: { type: string }
            risks:
              type: array
              items:
                type: object
                properties:
                  risk_id: { type: string }
                  category: { type: string }
                  severity: { type: string, enum: [critical, high, medium, low] }
                  probability: { type: number, minimum: 0, maximum: 1 }
                  description: { type: string }
                  mitigation: { type: string }
            overall_risk_level:
              type: string
              enum: [critical, high, medium, low]
          required: [risk_assessment_id, risks, overall_risk_level]

    triggers:
      - type: event
        value: "ao.new_detected"
        description: "Audit asynchrone de chaque nouvel AO"
        priority: normal
        async: true
      - type: cron
        value: "0 0 * * 0"
        description: "Audit hebdomadaire complet"
        timezone: "Europe/Paris"
        enabled: true
      - type: event
        value: "decision.chain_complete"
        description: "Audit post-decision"
        priority: normal
        async: true
      - type: event
        value: "user.request_audit"
        description: "Demande manuelle d'audit"
        priority: high

    permissions:
      memory: [read.public, read.private, read.tenant]
      bus: [publish, subscribe]
      external_apis:
        - POSTGRES_AUDIT_LOG
        - RGPD_REGISTRY_API

    lifecycle:
      max_execution_time: 180
      retry_policy:
        max_retries: 2
        backoff: linear
        initial_delay: 5
        max_delay: 60
      timeout_action: "publish_event:auditor.timeout"
      failure_action: "publish_event:auditor.failed"

    config:
      frameworks:
        AI_ACT:
          version: "2024/1689"
          risk_level: "high"
          applicable_articles: ["50", "52", "53", "55", "56"]
          transparency_required: true
          human_oversight_required: true
        RGPD:
          version: "2016/679"
          dpo_contact: "dpo@takaos.io"
          retention_years: 5
          right_to_explanation: true
        MARCHES_PUBLICS:
          code: "Code de la commande publique"
          seuils:
            europe: 215000
            national: 90000
            local: 40000
      risk_thresholds:
        critical: 0.9
        high: 0.7
        medium: 0.4
        low: 0.0
      audit_retention_days: 2555

  # ---------------------------------------------------------------------------
  # AGENT: COMPLIANCE OFFICER
  # ---------------------------------------------------------------------------
  - agent_id: compliance_officer
    name: "Agent Compliance Officer"
    version: "1.0"
    description: "Gere la conformite AI Act niveau 3 (transparence, tracabilite, droits)"
    status: stable
    dependencies:
      - agent_id: auditor
        min_version: "1.0"

    capabilities:
      - name: log_decision
        version: "1.0"
        description: "Enregistrer une decision avec tracabilite complete (AI Act Art.12)"
        input_schema:
          type: object
          properties:
            decision_type:
              type: string
              enum: [scoring, redaction, depot, reject, escalation]
            decision_id: { type: string }
            agent_id: { type: string }
            ao_id: { type: string }
            input_summary:
              type: object
              description: "Resume des entrees ayant conduit a la decision"
            output_summary:
              type: object
              description: "Resume de la sortie / decision"
            confidence_score: { type: number }
            human_override:
              type: boolean
              default: false
          required: [decision_type, decision_id, agent_id, ao_id]
        output_schema:
          type: object
          properties:
            log_id: { type: string }
            decision_id: { type: string }
            logged_at:
              type: string
              format: date-time
            integrity_hash: { type: string }
            retention_until:
              type: string
              format: date-time
          required: [log_id, decision_id, logged_at, integrity_hash]

      - name: generate_transparency_report
        version: "1.0"
        description: "Generer un rapport de transparence pour les utilisateurs (AI Act Art.52)"
        input_schema:
          type: object
          properties:
            period_start:
              type: string
              format: date-time
            period_end:
              type: string
              format: date-time
            ao_id:
              type: string
              description: "Optionnel: filtrer sur un AO specifique"
            format:
              type: string
              enum: [json, markdown, pdf]
              default: markdown
          required: [period_start, period_end]
        output_schema:
          type: object
          properties:
            report_id: { type: string }
            period: { type: string }
            content: { type: string }
            decisions_count: { type: integer }
            human_overrides_count: { type: integer }
            average_confidence: { type: number }
            generated_at:
              type: string
              format: date-time
          required: [report_id, period, content, decisions_count]

      - name: handle_user_request
        version: "1.0"
        description: "Traiter une demande utilisateur (droit d'acces, rectification, effacement RGPD)"
        input_schema:
          type: object
          properties:
            request_type:
              type: string
              enum: [access, rectification, erasure, portability, restriction, objection]
            user_id: { type: string }
            scope:
              type: string
              enum: [all, specific_ao, date_range]
            scope_details:
              type: object
            request_metadata:
              type: object
              description: "Metadonnees de la demande"
          required: [request_type, user_id]
        output_schema:
          type: object
          properties:
            request_reference: { type: string }
            status:
              type: string
              enum: [acknowledged, processing, completed, rejected, requires_identity]
            estimated_completion_days: { type: integer }
            result_summary: { type: string }
            handled_at:
              type: string
              format: date-time
          required: [request_reference, status]

      - name: explain_decision
        version: "1.0"
        description: "Fournir une explication comprehensible d'une decision IA (droit a l'explication)"
        input_schema:
          type: object
          properties:
            decision_id: { type: string }
            user_language:
              type: string
              enum: [fr, en, de, es]
              default: fr
            detail_level:
              type: string
              enum: [simple, detailed, technical]
              default: simple
          required: [decision_id]
        output_schema:
          type: object
          properties:
            explanation_id: { type: string }
            decision_id: { type: string }
            explanation: { type: string }
            factors:
              type: array
              items:
                type: object
                properties:
                  factor: { type: string }
                  weight: { type: number }
                  impact: { type: string }
            user_rights:
              type: array
              items: { type: string }
            generated_at:
              type: string
              format: date-time
          required: [explanation_id, decision_id, explanation]

    triggers:
      - type: event
        value: "any_decision"
        description: "Toute decision emise par un agent"
        priority: high
        filter: "decision_confidence < 1.0"
      - type: event
        value: "user.request_data"
        description: "Demande RGPD de l'utilisateur"
        priority: critical
      - type: event
        value: "user.request_explanation"
        description: "Demande d'explication d'une decision"
        priority: high
      - type: cron
        value: "0 0 1 * *"
        description: "Rapport mensuel de transparence"
        timezone: "Europe/Paris"
        enabled: true

    permissions:
      memory: [read.public, read.private, read.tenant, write.tenant]
      bus: [publish, subscribe]
      vault: [read]
      external_apis:
        - POSTGRES_AUDIT_LOG
        - RGPD_REGISTRY_API

    lifecycle:
      max_execution_time: 120
      retry_policy:
        max_retries: 3
        backoff: exponential
        initial_delay: 5
        max_delay: 60
      timeout_action: "publish_event:compliance.timeout"
      failure_action: "publish_event:compliance.failed"

    config:
      ai_act:
        risk_level: "high"
        applicable_articles: ["50", "52", "53", "55", "56"]
        human_oversight_required: true
        transparency_notifications: true
      rgpd:
        dpo_email: "dpo@takaos.io"
        retention_years: 5
        right_to_explanation: true
        erasure_grace_days: 30
      audit:
        log_level: "decision"
        hash_algorithm: "sha256"
        retention_days: 2555
        immutable_storage: true
      reporting:
        transparency_period: "monthly"
        include_confidence_histogram: true
        include_human_override_stats: true

# ============================================================================
# SCORING PROFILES
# ============================================================================
scoring_profiles:
  prudent:
    name: "Profil Prudent"
    description: "Entreprise risk-averse, ne depose que sur des AO tres bien alignes"
    icon: "shield"
    thresholds:
      go: 0.80
      maybe: 0.60
      no_go: 0.0
    weights:
      coherence_metier: 0.30
      viabilite_financiere: 0.25
      accessibilite_geographique: 0.15
      faisabilite_temporelle: 0.20
      intelligence_concurrentielle: 0.10
    rules:
      - "Rejet si CA insuffisant (< 2x le montant de l'AO)"
      - "Rejet si deadline < 10 jours"
      - "Rejet si distance > 150 km sans antenne locale"
      - "Rejet si experience similaire < 3 references"
      - "GO uniquement si score >= 0.80 ET aucun flag critique"

  opportuniste:
    name: "Profil Opportuniste"
    description: "Entreprise agile, tente des AO en dehors du coeur de metier"
    icon: "rocket"
    thresholds:
      go: 0.55
      maybe: 0.35
      no_go: 0.0
    weights:
      coherence_metier: 0.15
      viabilite_financiere: 0.20
      accessibilite_geographique: 0.15
      faisabilite_temporelle: 0.20
      intelligence_concurrentielle: 0.30
    rules:
      - "Accepte CA >= 1.5x le montant de l'AO"
      - "Accepte deadline >= 5 jours"
      - "Intelligence concurrentielle priorisee"
      - "Tente les AO innovants ou emergents"
      - "GO si score >= 0.55 et upside strategique"

  specialise:
    name: "Profil Specialise"
    description: "Entreprise de niche, tres forte sur un domaine precis"
    icon: "crosshair"
    thresholds:
      go: 0.75
      maybe: 0.45
      no_go: 0.0
    weights:
      coherence_metier: 0.40
      viabilite_financiere: 0.20
      accessibilite_geographique: 0.10
      faisabilite_temporelle: 0.15
      intelligence_concurrentielle: 0.15
    rules:
      - "Priorite absolue sur la coherence metier"
      - "Accepte distance plus grande si expertise unique"
      - "Valorise les certifications sectorielles"
      - "GO si coherence_metier >= 0.90 meme si autres scores moyens"
      - "Rejet si expertise cles manquantes"

# ============================================================================
# EVENT FLOW - ORCHESTRATION
# ============================================================================
event_flow:
  - trigger: "cron: 0 6 * * *"
    agent: veilleur
    produces: ["ao.new_detected"]
    description: "Veille matinale sur les portails"

  - trigger: "event: ao.new_detected"
    agent: scorer
    condition: "confidence_score >= 0.7"
    produces: ["ao.scored"]
    description: "Scoring automatique des AO detectes"

  - trigger: "event: ao.scored"
    condition: "score >= profile.thresholds.go"
    action: "move_to_pipeline:in_preparation"
    produces: ["ao.decision:deposer"]
    description: "Decision GO -> passage en preparation"

  - trigger: "event: ao.scored"
    condition: "score >= profile.thresholds.maybe AND score < profile.thresholds.go"
    action: "move_to_pipeline:in_review"
    produces: ["ao.decision:review"]
    description: "Decision MAYBE -> revue manuelle"

  - trigger: "event: ao.scored"
    condition: "score < profile.thresholds.maybe"
    action: "move_to_pipeline:archived"
    produces: ["ao.decision:pass"]
    description: "Decision NO-GO -> archive"

  - trigger: "event: ao.decision:deposer"
    agent: redacteur
    produces: ["memoire.ready", "dce.ready"]
    description: "Redaction des documents de candidature"

  - trigger: "event: memoire.ready"
    agent: deposant
    condition: "confirm_before_submit == true"
    produces: ["ao.submitted", "ao.proof_captured"]
    description: "Depot sur le portail acheteur"

  - trigger: "event: any_decision"
    agent: compliance_officer
    produces: ["compliance.logged"]
    description: "Tracabilite de chaque decision"

  - trigger: "event: ao.new_detected"
    agent: auditor
    async: true
    produces: ["audit.completed"]
    description: "Audit asynchrone de conformite"

  - trigger: "cron: 0 0 * * 0"
    agent: auditor
    produces: ["audit.weekly_report"]
    description: "Rapport hebdomadaire d'audit"

  - trigger: "cron: 0 0 1 * *"
    agent: compliance_officer
    produces: ["compliance.monthly_report"]
    description: "Rapport mensuel de transparence"

# ============================================================================
# PIPELINE STATES
# ============================================================================
pipeline_states:
  - id: detected
    name: "Detecte"
    description: "AO detecte par le Veilleur"
    color: "#6B7280"
  - id: scored
    name: "Evalue"
    description: "AO score par le Scorer"
    color: "#3B82F6"
  - id: in_review
    name: "En revue"
    description: "Decision MAYBE, attente validation humaine"
    color: "#F59E0B"
  - id: in_preparation
    name: "En preparation"
    description: "Decision GO, redaction en cours"
    color: "#8B5CF6"
  - id: drafting
    name: "Redaction"
    description: "Le Redacteur genere les documents"
    color: "#EC4899"
  - id: ready_to_submit
    name: "Pret pour depot"
    description: "Documents prets, attente confirmation"
    color: "#10B981"
  - id: submitted
    name: "Depose"
    description: "Candidature deposee sur le portail"
    color: "#059669"
  - id: archived
    name: "Archive"
    description: "AO classe (NO-GO ou traite)"
    color: "#9CA3AF"
  - id: error
    name: "Erreur"
    description: "Une erreur a interrompu le processus"
    color: "#DC2626"

# ============================================================================
# GLOBAL CONFIG
# ============================================================================
config:
  kernel:
    event_bus: "asyncio"
    future_bus: "nats"
    max_concurrent_agents: 10
    default_timezone: "Europe/Paris"
  memory:
    zones: [public, private, tenant]
    vector_store: "pgvector"
    embedding_model: "mistral-embed"
    embedding_dimensions: 1024
  llm:
    default_provider: "mistral"
    default_model: "mistral-large-latest"
    fallback_model: "mistral-medium"
    max_retries: 3
    timeout: 120
  security:
    vault_required: true
    audit_all_decisions: true
    human_in_the_loop_for_depot: true
    encryption_at_rest: true
  integrations:
    crm:
      providers: [hubspot, pipedrive, salesforce, dynamics, odoo]
      default: hubspot
    erp:
      providers: [sap, netsuite, sage, cegid]
      default: sage
    accounting:
      providers: [chift, pennylane, dougs]
      default: chift
    signature:
      providers: [yousign, docusign, adobe_sign]
      default: yousign
    vision:
      providers: [taka_vision_holo1]
      required_version: "1.2.0"
