"""Docker Compose production-like pour staging TAKA OS.
Différences avec le dev :
- Backend : image buildée (pas volume mount du code source)
- Frontend : dist buildé servi par nginx principal (pas conteneur frontend séparé)
- Nginx : reverse proxy + SSL auto-signé + rate limiting
- DB/Redis : pas de ports exposés publiquement
- Health checks sur tous les services
"""

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: taka-nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/staging/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/staging/nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taka-staging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Backend FastAPI ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taka-backend-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql+asyncpg://takaos:${POSTGRES_PASSWORD}@db:5432/takaos
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taka-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Database PostgreSQL + pgvector ---
  db:
    image: ankane/pgvector:latest
    container_name: taka-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: takaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takaos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    expose:
      - "5432"
    networks:
      - taka-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaos -d takaos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: taka-redis-staging
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - taka-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Backup automatique ---
  backup:
    image: postgres:15-alpine
    container_name: taka-backup-staging
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          sleep 86400;
          pg_dump -h db -U takaos takaos > /backups/takaos_$$(date +%Y%m%d_%H%M%S).sql;
          find /backups -name 'takaos_*.sql' -mtime +7 -delete;
        done
      "
    depends_on:
      - db
    networks:
      - taka-staging

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  taka-staging:
    driver: bridge
