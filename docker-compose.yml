version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: taka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takaos_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-takaos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-vector.sh:/docker-entrypoint-initdb.d/01-init-vector.sh:ro
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takaos} -d ${POSTGRES_DB:-takaos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - taka-network

  redis:
    image: redis:7-alpine
    container_name: taka-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6380:6379"
    networks:
      - taka-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taka-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-takaos}:${POSTGRES_PASSWORD:-takaos_password_123}@db:5432/${POSTGRES_DB:-takaos}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - taka_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health/live\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - taka-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taka-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - taka-network

volumes:
  pgdata:
  taka_data:

networks:
  taka-network:
    driver: bridge
