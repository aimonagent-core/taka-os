[tool.poetry]
name = "taka-api"
version = "0.9.0"
description = "TAKA - Plateforme d'appels d'offres automatises"
authors = ["TAKA Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
pgvector = "^0.3.0"
alembic = "^1.14.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.17"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
email-validator = "^2.2.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"

# NOUVEAUX PACKAGES DE PRODUCTION
sentry-sdk = { extras = ["fastapi"], version = "^2.0.0" }
slowapi = "^0.1.9"
redis = "^5.0.0"
openpyxl = "^3.1.0"
pyotp = "^2.9.0"
qrcode = { extras = ["pil"], version = "^7.4.2" }
pybreaker = "^0.8.0"
structlog = "^24.1.0"
tenacity = "^8.2.0"
pypdf = "^4.0.0"
pdfplumber = "^0.10.0"
pdf2image = "^1.17.0"
pytesseract = "^0.3.10"
pillow = "^10.0.0"
numpy = "^1.26.0"
dateparser = "^1.2.0"
apscheduler = "^3.10.0"
pyyaml = "^6.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"
reportlab = "^4.0.0"
stripe = "^11.0.0"
resend = "^2.0.0"
pandas = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
faker = "^22.0.0"
ruff = "^0.2.0"
mypy = "^1.13.0"
factory-boy = "^3.3.0"
black = "^24.10.0"
isort = "^5.13.0"
flake8 = "^7.1.0"
bandit = "^1.7.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# Ruff (linter / formatteur)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (gere par le formatteur)
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/*" = ["T20", "S101"]  # print et assert autorises dans les tests

# =============================================================================
# MyPy
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: tests lents (integration externe)",
    "integration: tests d'integration",
    "migrations: tests de migration Alembic",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::UserWarning:pydantic.*",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 60

# =============================================================================
# Black / isort (legacy — migres vers Ruff)
# =============================================================================
[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
